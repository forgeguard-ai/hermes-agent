name: Release on Merge

# Fork-oriented release automation. A release-relevant PR merged into `main`
# gets a GitHub Release: Linux + macOS desktop installers attached, and both
# runtime images (ghcr.io/forgeguard-ai/hermes-agent) tagged with the same
# version in addition to their rolling <variant>-<sha>/<variant>-latest tags.
#
# Version scheme — two modes, picked by the FORK_UPSTREAM_BASE marker at repo
# root (maintained by the upstream-sync runbook — see
# docs/maintainers/upstream-sync/sync-policy.md). The rules live in
# .github/scripts/fork_release_version.py (unit-tested in tests/fork/):
#   • upstream-release mode — the marker holds a plain upstream semver release
#     (v0.22.2): the release is v0.22.2-forgeguard.<N>, N = 1 + the highest
#     v0.22.2-forgeguard.* tag already on the remote (read with
#     `git ls-remote`, never local tags), so N restarts at 1 for each upstream
#     release. The version files are not read: they hold 0.0.0 once the fork
#     takes upstream's build-time install stamp.
#   • legacy mode — any other marker, notably the calendar-shaped bases
#     (v2026.8.31) tracked before that sync: the release is the pyproject.toml
#     version (v0.21.1), and a RE-CUT of an already-released version gets
#     "-forgeguard.<n>" (counting the plain tag as cut 1). Releases up to
#     v2026.7.1-forgeguard.3 used the older <upstream-base-tag>-forgeguard.<n>
#     scheme.
# A computed version of 0.0.0 or an empty one is refused. FORK_UPSTREAM_COMMIT
# (optional, written by the sync) names the exact upstream commit merged; the
# release notes show it beside the base, with the runtime image digest.
#
# Manual runs (workflow_dispatch) default to dry_run: compute and print the
# version, tag and release notes, build and publish nothing. A manual run
# with dry_run=false is a real release and is refused off main.
#
# Release gating (2026-07-03): merges skip the whole pipeline — no macOS
# runner, no image builds, no release — when either
#   • the PR carries the `no-release` label, or
#   • the PR touches no release-relevant paths (docs-/CI-/tests-only merges
#     don't change the shipped artifacts).
# This replaced the deliberately-unfiltered release-every-merge behavior once
# the doc-only release churn outweighed its simplicity.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print the version, tag and release notes only — build, tag and publish nothing"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

# One fixed group (not per-PR) so releases SERIALIZE: two PRs merged close
# together would otherwise run compute-version in parallel, both read the same
# highest -forgeguard.N, compute N+1, push images over each other, and the
# second `gh release create` would fail on the duplicate tag. Queue them so each
# reads the previous release's tag.
concurrency:
  group: release-on-merge-main
  cancel-in-progress: false

jobs:
  compute-version:
    name: Compute release version
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
      version: ${{ steps.version.outputs.version }}
      base_tag: ${{ steps.version.outputs.base_tag }}
      hermes_version: ${{ steps.version.outputs.hermes_version }}
      upstream_commit: ${{ steps.version.outputs.upstream_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      # Skip the release when the merged PR changed nothing that ships:
      # docs, website, markdown, CI/workflow config, and tests don't alter
      # the desktop installers or the runtime images. Skills ARE shipped —
      # the image bakes the whole tree in (`COPY . .`) and stage2-hook syncs
      # skills/ + optional-skills/ into the running agent — so a skills-only
      # change is release-relevant and must NOT be skipped.
      # Uses the paginated files API (a sync PR can touch >100 files; the
      # single-page `gh pr view --json files` would silently truncate).
      # A manual run skips the path gate (there is no PR); it releases for
      # real only with dry_run=false, and only from main.
      - name: Decide whether this merge ships a release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::A manual release (dry_run=false) must run on main, not ${GITHUB_REF}."
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
          files="$(gh api "repos/${{ github.repository }}/pulls/${PR}/files" --paginate --jq '.[].filename')"
          should=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|website/*|tests/*|.github/*|*.md) ;;
              *) should=true; break ;;
            esac
          done <<EOF2
          $files
          EOF2
          echo "should_release=$should" >> "$GITHUB_OUTPUT"
          if [ "$should" = "false" ]; then
            echo "::notice::No release-relevant paths in PR #${PR} — skipping the release pipeline (label a PR 'no-release' to skip explicitly)."
          fi

      - name: Compute release version
        id: version
        if: steps.gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -f FORK_UPSTREAM_BASE ]; then
            BASE_TAG="$(tr -d '[:space:]' < FORK_UPSTREAM_BASE)"
          else
            BASE_TAG="$(git describe --tags --abbrev=0 HEAD)"
            echo "::notice::No FORK_UPSTREAM_BASE marker yet; using nearest reachable tag '$BASE_TAG'. Run the upstream-sync runbook (docs/maintainers/upstream-sync/sync-policy.md) to pin this properly once main is synced to a real upstream release."
          fi

          # Upstream-release mode counts the remote's tags; legacy mode counts
          # GitHub Releases, exactly as before. Both lists are cheap, so read
          # both and let the script pick.
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName \
            | jq -r '.[].tagName' > "$RUNNER_TEMP/release-tags.txt"
          git ls-remote --tags --refs origin > "$RUNNER_TEMP/remote-tags.txt"

          python3 .github/scripts/fork_release_version.py version \
            --base-tag "$BASE_TAG" \
            --pyproject pyproject.toml \
            --upstream-commit-file FORK_UPSTREAM_COMMIT \
            --remote-tags "$RUNNER_TEMP/remote-tags.txt" \
            --release-tags "$RUNNER_TEMP/release-tags.txt" \
            --output "$GITHUB_OUTPUT"

      # Render the notes now (digest still a placeholder) so a broken template
      # fails before any build starts, and so a dry run shows exactly what
      # would be published.
      - name: Preview release notes
        if: steps.gate.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE_TAG: ${{ steps.version.outputs.base_tag }}
          HERMES_VERSION: ${{ steps.version.outputs.hermes_version }}
          UPSTREAM_COMMIT: ${{ steps.version.outputs.upstream_commit }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ steps.gate.outputs.dry_run }}
        run: |
          set -euo pipefail
          python3 .github/scripts/fork_release_version.py notes \
            --template .github/release-notes-template.md \
            --version "$VERSION" \
            --base-tag "$BASE_TAG" \
            --hermes-version "$HERMES_VERSION" \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --pr "${PR_NUMBER:-}" \
            --output "$RUNNER_TEMP/release-notes.md"
          if [ "$DRY_RUN" = "true" ]; then
            heading="Dry run — would release \`${VERSION}\` (nothing built, tagged or published)"
          else
            heading="Release \`${VERSION}\`"
          fi
          {
            echo "## ${heading}"
            echo
            echo "Tag: \`${VERSION}\` · runtime image tag: \`runtime-${VERSION}\` · upstream base: \`${BASE_TAG}\`${UPSTREAM_COMMIT:+ (\`${UPSTREAM_COMMIT}\`)}"
            echo
            echo "### Release notes"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build-desktop:
    name: Build desktop installers
    needs: compute-version
    if: needs.compute-version.outputs.should_release == 'true' && needs.compute-version.outputs.dry_run != 'true'
    uses: ./.github/workflows/build-desktop-client.yml
    with:
      upload: true

  build-images:
    name: Build runtime images
    needs: compute-version
    if: needs.compute-version.outputs.should_release == 'true' && needs.compute-version.outputs.dry_run != 'true'
    uses: ./.github/workflows/build-runtime-images.yml
    with:
      push: true
      version: ${{ needs.compute-version.outputs.version }}

  publish-release:
    name: Publish GitHub Release
    needs: [compute-version, build-desktop, build-images]
    if: needs.compute-version.outputs.should_release == 'true' && needs.compute-version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      # Only the notes template and the script that renders it are needed.
      - name: Checkout release scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github

      - name: Download Linux installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hermes-desktop-linux
          path: release-assets

      - name: Download macOS installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hermes-desktop-macos
          path: release-assets

      - name: Download Windows installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hermes-desktop-windows
          path: release-assets

      - name: Write release notes
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          BASE_TAG: ${{ needs.compute-version.outputs.base_tag }}
          HERMES_VERSION: ${{ needs.compute-version.outputs.hermes_version }}
          UPSTREAM_COMMIT: ${{ needs.compute-version.outputs.upstream_commit }}
          RUNTIME_DIGEST: ${{ needs.build-images.outputs.runtime_digest }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$RUNTIME_DIGEST" ]; then
            echo "::warning::The image build reported no runtime digest; the release notes carry a placeholder."
          fi
          python3 .github/scripts/fork_release_version.py notes \
            --template .github/release-notes-template.md \
            --version "$VERSION" \
            --base-tag "$BASE_TAG" \
            --hermes-version "$HERMES_VERSION" \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --runtime-digest "$RUNTIME_DIGEST" \
            --pr "${PR_NUMBER:-}" \
            --output /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compute-version.outputs.version }}
          HERMES_VERSION: ${{ needs.compute-version.outputs.hermes_version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            ""|v0.0.0|v0.0.0-*) echo "::error::Refusing to publish release version '${VERSION}'."; exit 1 ;;
          esac
          gh release create "$VERSION" \
            release-assets/* \
            --repo "${{ github.repository }}" \
            --title "Hermes Agent ${VERSION}" \
            --notes-file /tmp/release-notes.md
