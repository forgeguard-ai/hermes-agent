name: OSV-Scanner

# Scans lockfiles (uv.lock, package-lock.json) against the OSV vulnerability
# database. Runs on every PR/push (via the ci.yml orchestrator's workflow_call)
# and on a weekly schedule against main.
#
# This is detection-only — OSV-Scanner does NOT open PRs or modify pins.
# It reports known CVEs in currently-pinned dependency versions so we can
# decide when and how to patch on our own schedule. Our pinning strategy
# (full SHA / exact version) is preserved; only the notification signal
# is added.
#
# Complements the supply-chain-audit.yml workflow (which scans for malicious
# code patterns in PR diffs) by covering the orthogonal "currently-pinned
# dep became known-vulnerable" case.
#
# Uses Google's osv-scanner/osv-reporter ACTIONS directly, pinned by SHA
# (upstream calls google's reusable workflow instead; the forgeguard-ai org
# policy only allows forgeguard-ai-owned reusable workflows, so that call
# fails all of CI at startup — see the scan job's comment).
# Findings land in the repo's Security tab (Code Scanning > OSV-Scanner).
# fail-on-vuln is disabled so the job does not block merges on pre-existing
# vulnerabilities in pinned deps that we may need to patch deliberately.
#
# A wrapper job downloads the SARIF result and summarizes the vulnerability
# count into a review_status for the unified PR comment.

# ForgeGuard fork: schedule trigger removed — the weekly cron is guarded
# upstream-only and produced a skipped run every Monday. The workflow_call from
# ci.yaml is the fork's real scan. See patch-inventory.md ("Trigger-stripped
# upstream-infra workflows").
on:
  workflow_call:
  workflow_dispatch:

permissions:
  # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan lockfiles
    # ForgeGuard fork guard: the weekly cron is upstream-infrastructure-only.
    # workflow_call (from ci.yml) and manual dispatch still run on the fork.
    #
    # ForgeGuard fork rewrite (same class as docker-lint.yml): upstream calls
    # google's REUSABLE WORKFLOW here, but the forgeguard-ai org policy only
    # allows reusable workflows owned by forgeguard-ai — the call fails ALL of
    # CI at startup ("all reusable workflows must be from a repository owned
    # by forgeguard-ai"). External ACTIONS from verified creators are allowed,
    # so this job invokes google's osv-scanner/osv-reporter actions directly
    # (the shape this file had before upstream's reusable-workflow migration),
    # preserving upstream's substance: the five lockfile sources of truth, the
    # `osv-results.sarif` file under the "OSV Scanner SARIF file" artifact that
    # the emit-status wrapper downloads, fail-on-vuln=false, and the
    # code-scanning upload the reusable workflow performed internally.
    if: github.event_name != 'schedule' || github.repository == 'NousResearch/hermes-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 'Run scanner'
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # Scan explicit lockfiles rather than recursing, so we only look at
          # the five sources of truth and skip vendored / test / worktree dirs.
          scan-args: |-
            --output=results.json
            --format=json
            --lockfile=uv.lock
            --lockfile=package-lock.json
            --lockfile=website/package-lock.json
            --lockfile=plugins/platforms/photon/sidecar/package-lock.json
            --lockfile=scripts/whatsapp-bridge/package-lock.json
        continue-on-error: true

      - name: 'Run osv-scanner-reporter'
        uses: google/osv-scanner-action/osv-reporter-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=false

      # The emit-status wrapper below downloads this artifact by name and reads
      # the osv-results.sarif inside it — keep both names stable.
      - name: 'Upload artifact'
        id: 'upload_artifact'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner SARIF file
          path: osv-results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard.
      - name: 'Upload to code-scanning'
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: osv-results.sarif

      - name: 'Error troubleshooter'
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        run: |
          echo "::error::Artifact upload failed. This is most likely caused by a error during scanning earlier in the workflow."
          exit 1

  emit-status:
    name: Emit review status
    runs-on: ubuntu-latest
    needs: scan
    # always() so a scan failure still emits a status, but keep the ForgeGuard
    # schedule guard consistent with the scan job so the weekly cron stays
    # upstream-only end to end.
    if: always() && (github.event_name != 'schedule' || github.repository == 'NousResearch/hermes-agent')
    outputs:
      review_status: ${{ steps.emit.outputs.review_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download SARIF result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OSV Scanner SARIF file
          path: /tmp/osv-results
        continue-on-error: true

      - name: Emit review_status
        id: emit
        run: |
          set -euo pipefail
          STATUS="[]"

          if [ -f /tmp/osv-results/osv-results.sarif ]; then
            # Count vulnerabilities from the SARIF file
            VULN_COUNT=$(python3 -c "
          import json, sys
          try:
              with open('/tmp/osv-results/osv-results.sarif') as f:
                  data = json.load(f)
              count = 0
              vulns = []
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      count += 1
                      rule_id = result.get('ruleId', 'unknown')
                      message = result.get('message', {}).get('text', '')
                      loc = result.get('locations', [{}])[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')
                      vulns.append(f'- {rule_id} in {loc}: {message}')
              print(count)
              if vulns:
                  print('\n'.join(vulns[:20]), file=sys.stderr)
          except Exception:
              print(0)
          ")

            VULN_DETAIL=""
            if [ "$VULN_COUNT" -gt 0 ] 2>/dev/null; then
              VULN_PLURAL=$([ "$VULN_COUNT" -eq 1 ] && echo "y" || echo "ies")
              VULN_DETAIL=$(python3 -c "
          import json, sys
          try:
              with open('/tmp/osv-results/osv-results.sarif') as f:
                  data = json.load(f)
              vulns = []
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      rule_id = result.get('ruleId', 'unknown')
                      loc = result.get('locations', [{}])[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')
                      vulns.append(f'- {rule_id} in {loc}')
              print(json.dumps('\n'.join(vulns[:20])))
          except Exception:
              print(json.dumps(''))
          ")
              STATUS="[{\"source\":\"osv scan\",\"results\":[{\"kind\":\"warning\",\"title\":\"OSV vulnerability scan\",\"summary\":\"${VULN_COUNT} known vulnerabilit${VULN_PLURAL} found in pinned dependencies.\",\"detail\":${VULN_DETAIL},\"how_to_fix\":\"Review the findings in the [Security tab](../../security/code-scanning). Update the affected dependencies if a patched version is available.\"}]}]"
            else
              STATUS="[]"
            fi
          fi

          echo "review_status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "review_status=${STATUS}" > review-status.json

      - name: Upload review status artifact
        if: always() && steps.emit.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-status-osv-scanner
          path: review-status.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
